name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r tests/requirements.txt

      - name: Test the app and manifest contracts
        run: python -m unittest discover -s tests -v

      - name: Check the local runner script
        run: bash -n run-local.sh

      - name: Build the application image
        run: docker build --tag k8s-hello:ci app
